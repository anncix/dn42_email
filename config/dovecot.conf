# LightMail Dovecot 配置模板

# ============================================================
# /etc/dovecot/conf.d/10-mail.conf
# ============================================================
mail_location = maildir:/var/mail/vmail/%d/%n
mail_privileged_group = mail
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# ============================================================
# /etc/dovecot/conf.d/10-auth.conf
# ============================================================
disable_plaintext_auth = no
auth_mechanisms = plain login
!include auth-sql.conf.ext

# ============================================================
# /etc/dovecot/conf.d/auth-sql.conf.ext
# ============================================================
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ============================================================
# /etc/dovecot/dovecot-sql.conf.ext
# ============================================================
driver = sqlite
connect = /path/to/lightmail/data/lightmail.db

default_pass_scheme = SHA256

password_query = \
  SELECT username, password_hash AS password, \
  '/var/mail/vmail/%d/%n' as userdb_home, \
  'maildir:/var/mail/vmail/%d/%n' as userdb_mail, \
  5000 as userdb_uid, 5000 as userdb_gid \
  FROM users WHERE username = '%n' AND is_active = 1

user_query = \
  SELECT '/var/mail/vmail/%d/%n' as home, \
  'maildir:/var/mail/vmail/%d/%n' as mail, \
  5000 as uid, 5000 as gid, \
  quota_mb * 1024 * 1024 as quota_rule=*:bytes=%{quota_mb}M \
  FROM users WHERE username = '%n' AND is_active = 1

# ============================================================
# /etc/dovecot/conf.d/10-master.conf
# ============================================================
service imap-login {
  inet_listener imap {
    address = 127.0.0.1, 172.20.xx.xx
    port = 143
  }
  inet_listener imaps {
    address = 127.0.0.1, 172.20.xx.xx
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    address = 127.0.0.1, 172.20.xx.xx
    port = 110
  }
  inet_listener pop3s {
    address = 127.0.0.1, 172.20.xx.xx
    port = 995
    ssl = yes
  }
}

# Postfix SASL 认证
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
}

# ============================================================
# /etc/dovecot/conf.d/10-ssl.conf
# ============================================================
ssl = required
ssl_cert = </etc/ssl/certs/mail.yourdomain.dn42.crt
ssl_key = </etc/ssl/private/mail.yourdomain.dn42.key
ssl_protocols = !SSLv3 !TLSv1 !TLSv1.1
ssl_cipher_list = HIGH:!aNULL:!MD5

# ============================================================
# /etc/dovecot/conf.d/20-imap.conf
# ============================================================
protocol imap {
  mail_plugins = $mail_plugins quota imap_quota
}

# ============================================================
# /etc/dovecot/conf.d/90-quota.conf
# ============================================================
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=1G
  quota_warning = storage=95%% quota-warning 95 %u
  quota_warning2 = storage=80%% quota-warning 80 %u
}

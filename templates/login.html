<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - LightMail</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f7ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: 
    radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
}
.login-card {
  width: 400px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
  padding: 40px;
}
.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #2563eb, #0ea5e9);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 28px;
  margin: 0 auto 12px;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
}
.logo h1 {
  font-size: 28px;
  background: linear-gradient(135deg, #2563eb, #0ea5e9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo p {
  color: #64748b;
  font-size: 14px;
  margin-top: 4px;
}
.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #0f172a;
}
.form-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #c7e0f9;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  box-sizing: border-box;
}
.form-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.login-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #2563eb, #0ea5e9);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  transition: transform 0.2s;
}
.login-btn:hover { transform: translateY(-1px); }
.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: #64748b;
}
.login-footer a {
  color: #2563eb;
  text-decoration: none;
}
.status-bar {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid #e2e8f0;
}
.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
}
.status-dot.gray { background: #94a3b8; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">✉</div>
    <h1>LightMail</h1>
    <p>轻量级邮局系统 · DN42 双栈</p>
  </div>
  <form onsubmit="event.preventDefault(); location.href='/';">
    <div class="form-group">
      <label class="form-label">邮箱 / 用户名</label>
      <input type="text" class="form-input" placeholder="admin@example.dn42" value="admin">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" placeholder="请输入密码" value="admin123">
    </div>
    <button type="submit" class="login-btn">登 录</button>
  </form>
  <div class="login-footer">
    还没有账户？ <a href="#">立即注册</a>
  </div>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot"></span>
      <span>DN42 正常</span>
    </div>
    <div class="status-item">
      <span class="status-dot gray"></span>
      <span>公网已禁用</span>
    </div>
  </div>
</div>
</body>
</html>
